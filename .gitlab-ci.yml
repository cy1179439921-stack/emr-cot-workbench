include:
  - project: "EBOND-INFRA/ebond-ci-template"
    ref: main
    file: "jobs/build.yml"
  - project: "EBOND-INFRA/ebond-ci-template"
    ref: main
    file: "jobs/docker.yml"
  - project: "EBOND-INFRA/ebond-ci-template"
    ref: main
    file: "jobs/deploy-k8s-approval.yml"

# 全局变量
variables:
  ## 跳过证书验证
  GIT_SSL_NO_VERIFY: "1"
  ## 全局配置
  # 构建路径
  GIT_CLONE_PATH: ${CI_BUILDS_DIR}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/${CI_PIPELINE_ID}
  # 是否拉取代码
  GIT_CHECKOUT: "false"

  # CI 作业控制
  RUN_CODE_LINT: "no" # 是否进行lint yes/no
  RUN_CODE_QUALITY: "no" # 是否代码扫描 yes/no

  # 依赖镜像
  BUILD_IMAGE: "harbor.ebondhm.com/library/node:16.15.0-alpine-package"
  LINT_IMAGE: "harbor.ebondhm.com/library/node:16.15.0-alpine-package"
  PULL_CODE_IMAGE: "10.31.0.200:9077/library/busybox:latest"
  SONAR_IMAGE: "harbor.ebondhm.com/devops/sonar-scanner-cli:latest"
  CURL_IMAGE: "curlimages/curl:7.70.0"

# 全局默认值
default:
  image:
    name: alpine:latest
    pull_policy: if-not-present
  retry: 2
  tags:
    - build

# 流程控制
# 对于合并请求
# 对于没有打开的合并请求时的分支管道
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# 作业阶段
stages:
  - build
  - lint
  - quality
  - build-image
  - deploy-uat
  - deploy-stag
  - deploy-oauth
  - deploy-pre
  - deploy-prod

# 拉取代码
code:
  image: ${PULL_CODE_IMAGE}
  stage: .pre
  script:
    - ls
    - printenv
  variables:
    GIT_CHECKOUT: "true"

# 代码build
build:
  stage: build
  image: ${BUILD_IMAGE}
  script:
    - npm config set strict-ssl false
    - npm config set prefix /home/gitlab-runner/ci-build-cache/npm
    - npm config set cache /home/gitlab-runner/ci-build-cache/npm
    - npm config set registry https://registry.npm.taobao.org
    - npm config set sass_binary_site https://npm.taobao.org/mirrors/node-sass
    - pnpm install

# lint代码检查
lint:
  image:
    name: ${LINT_IMAGE}
    pull_policy: if-not-present
  stage: lint
  script:
    - npm run lint
  tags:
    - build
  rules:
    - if: " $RUN_CODE_LINT == 'no' "
      when: never
    - when: always

# 质量扫描
quality:
  image:
    name: ${SONAR_IMAGE}
    pull_policy: if-not-present
    entrypoint: [""]
  stage: quality
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_PROJECT_NAME}-${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -X
  rules:
    - if: " $RUN_CODE_QUALITY == 'no' "
      when: never
    - when: always

# 构建镜像
build_image:
  image:
    name: docker:stable
  services:
    - name: docker:dind
  stage: build-image
  variables:
    WORKER_BUILD: "idl_deploy"
    IMAGE_NAME: "10.31.0.200:9077/idl/${CI_PROJECT_NAME}:deploy-${CI_COMMIT_SHORT_SHA}"
    DOCKER_FILE_PATH: "./deploy/Dockerfile"
    DOCKER_HOST: tcp://docker:2376/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  extends: .build-docker

# 部署测试环境
deploy_uat:
  stage: deploy-uat
  script:
    - sed -i "s#__SERIVE_NAME__#${SERVICE_NAME}#g" deploy/docker-compose.yaml
    - sed -i "s#__CONTAINER_NAME__#${CONTAINER_NAME}#g" deploy/docker-compose.yaml
    - sed -i "s#__IMAGE_NAME__#${IMAGE_NAME}#g" deploy/docker-compose.yaml
    - sed -i "s#__MAP_PORT__#${MAP_PORT}#g" deploy/docker-compose.yaml
    - sed -i "s#__NET_NAME__#${NET_NAME}#g" deploy/docker-compose.yaml
    - sed -i "s#__VOLUME_NAME__#${VOLUME_NAME}#g" deploy/docker-compose.yaml
    - cat deploy/docker-compose.yaml
    - docker compose -p ${CI_PROJECT_NAME} -f deploy/docker-compose.yaml up -d --force-recreate
  variables:
    SERVICE_NAME: "${CI_PROJECT_NAME}-jiaodui"
    CONTAINER_NAME: "${CI_PROJECT_NAME}-jiaodui"
    IMAGE_NAME: "10.31.0.200:9077/idl/${CI_PROJECT_NAME}:deploy-${CI_COMMIT_SHORT_SHA}"
    MAP_PORT: 8901
    NET_NAME: "idl"
    VOLUME_NAME: "nginx-uat.conf"
    GIT_CHECKOUT: "true"
  when: manual
  tags:
    - deploy-uat

