# 部署省疾控IDL环境
deploy_sjk:
  variables:
    GIT_CHECKOUT: "true"
    PROJECT_DISPLAY_NAME: "省疾控-慢病监测"
    DEPLOY_FILE: "./deploy/deployment.yaml"
    APP_NAME_WORKER: "forntend"
    APP_NAME_PROJECT: "idl-train"
    ENV_NAME: "stag"
    IMAGE_ID: "uat"
    REPLICAS: 1
    NAMESPACE: "train"
    NODEPORT: 32719
    CONFIGMAP_FILE_ISEXIST: "true"
    CONFIGMAP_FILE: "./deploy/configmap-sjk.yaml"
    VOLUME_NAME: "nginx.conf"
    CONFIGMAP_NAME: "idl-frontend"
    IMAGE_REPLACE: "true"
    IMAGE_SRC: "10.31.0.200:9077/idl/${CI_PROJECT_NAME}:deploy-${CI_COMMIT_SHORT_SHA}"
    IMAGE_NAME: "10.60.0.198:9077/idl/${CI_PROJECT_NAME}:deploy-${CI_COMMIT_SHORT_SHA}"
  stage: deploy-prod
  extends: .deploy_k8s_approval
