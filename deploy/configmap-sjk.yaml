apiVersion: v1
kind: ConfigMap
metadata:
  name: __configmapname__
  namespace: __namespace__
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    events {
        use epoll;
        worker_connections 100000;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        resolver 10.96.0.10 ipv6=off valid=10s;
        access_log /dev/stdout;
        error_log /dev/stdout debug;
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
        sendfile on;
        keepalive_timeout 70;
        client_max_body_size 500M;
        client_header_buffer_size 128k;
        large_client_header_buffers 4 128k;
        server {
            listen  80;
            server_name frontend;
            index index.html;
            root /usr/share/nginx/html;
            client_max_body_size 500M;
            charset utf_8;
            location ~ ^/api/(medical/AIChat|agent/(agentResearchProposalChapter|researchSelect|literatureReview))/(getReply|getReplyList|generateMultiRoundChat|aiModify|abbreviation|elaborate|rewrite|optimize)$ {
                proxy_pass http://backend.train.svc.cluster.local:8080$request_uri;
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
                proxy_read_timeout 300;
                proxy_buffering off;
                chunked_transfer_encoding on;
                proxy_cache off;
            }
            location /api {
                proxy_pass http://backend.train.svc.cluster.local:8080/api;
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
                proxy_read_timeout 300;
            }

            location ^~ /minio/ {
                proxy_pass http://minio.idl-minio.svc.cluster.local/;
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
                proxy_read_timeout 300;
            }
            location = /version.json {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                try_files $uri /index.html;
            }
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                try_files $uri /index.html;
            }
            
            location / {
                try_files $uri $uri/ @rewrites;
            }

            location @rewrites {
                rewrite ^(.+)$ /index.html last;
            }

            location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
                expires max;
                add_header Pragma public;
                add_header Cache-Control "public, must-revalidate, proxy-revalidate";
            }

            # location /status {
            #     vhost_traffic_status_display;
            #     vhost_traffic_status_display_format html;
            # }
        }
    }
