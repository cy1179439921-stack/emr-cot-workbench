user nginx;
worker_processes auto;
events {
    use epoll;
    worker_connections 10000;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log /dev/stdout;
    error_log /dev/stdout debug;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    sendfile on;
    keepalive_timeout 70;
    client_max_body_size 500M;
    client_header_buffer_size 128k;
    large_client_header_buffers 4 128k;
    server {
        listen  80;
        server_name frontend;
        index index.html;
        root /usr/share/nginx/html;

        location ~ ^/api/(medical/AIChat|agent/(agentResearchProposalChapter|researchSelect|literatureReview))/(getReply|getReplyList|generateMultiRoundChat|aiModify|abbreviation|elaborate|rewrite|optimize)$ {
            proxy_pass http://192.168.43.162:8089$request_uri;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            proxy_buffering off;          # 关闭响应缓冲
            chunked_transfer_encoding on; # 开启分块传输
            proxy_cache off;              # 关闭缓存
        }

        location /api {
            proxy_pass http://192.168.43.162:8089/api;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        location ^~ /minio/ {
            proxy_pass http://192.168.43.162:9000/;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }
        
        # ========== 版本更新相关配置 ==========

        # 禁止缓存 version.json（确保每次都获取最新版本号）
        location = /version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri /index.html;
        }

        # 禁止缓存 index.html（确保每次访问都加载最新入口文件）
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri /index.html;
        }

        location / {
            try_files $uri $uri/ @rewrites;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
            expires max;
            add_header Pragma public;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        location @rewrites {
            rewrite ^(.+)$ /index.html last;
        }

        location /status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format html;
        }
    }
}
